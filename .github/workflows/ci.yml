name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    uses: liara-engine/.github/.github/workflows/reusable-lint.yml@preview-24
    with:
      module: liara-interfaces
      github-repo-version: preview-24

  abi-header-portability:
    uses: liara-engine/.github/.github/workflows/reusable-abi-header-portability.yml@preview-24
    with:
      include-dir: include
      c-standards: '11;17;23'
      cxx-standards: '17;20;23'
      github-repo-version: preview-24

  abi-interface-rules:
    uses: liara-engine/.github/.github/workflows/reusable-abi-interface-rules.yml@preview-24
    with:
      include-dir: include
      std: 'c++20'
      prefix: 'liara'
      github-repo-version: preview-24

  abi-layout-freeze:
    uses: liara-engine/.github/.github/workflows/reusable-abi-layout-freeze.yml@preview-24
    with:
      include-dir: include
      golden-header: 'tests/abi/abi_layout.generated.h'
      github-repo-version: preview-24

  abi-snapshot:
    uses: liara-engine/.github/.github/workflows/reusable-abi-snapshot.yml@preview-24
    with:
      include-dir: include
      std: 'c++20'
      github-repo-version: preview-24

  report:
#    needs: [ build-and-test, lint, abi-header-portability, abi-interface-rules, abi-layout-freeze, abi-snapshot ]
    needs: [ lint, abi-header-portability, abi-interface-rules, abi-layout-freeze, abi-snapshot ]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    uses: liara-engine/.github/.github/workflows/reusable-ci-report.yml@preview-24
    with:
      title: 'CI report'
      header: 'ci-report'
      github-repo-version: preview-24

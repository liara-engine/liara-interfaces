name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - '.github/workflows/ci.yml'
      - include/**
      - tests/**
      - .clang-format
      - .clang-tidy
      - CMakeLists.txt
      - manifest.json
      - vcpkg.json
      - vcpkg-configuration.json
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - include/**
      - tests/**
      - .clang-format
      - .clang-tidy
      - CMakeLists.txt
      - manifest.json
      - vcpkg.json
      - vcpkg-configuration.json
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    uses: liara-engine/.github/.github/workflows/reusable-build-and-test.yml@v2
    with:
      module: liara-interfaces
      github-repo-version: v1

  lint:
    uses: liara-engine/.github/.github/workflows/reusable-lint.yml@v2
    with:
      module: liara-interfaces
      github-repo-version: v1

  abi-header-portability:
    uses: liara-engine/.github/.github/workflows/reusable-abi-header-portability.yml@v2
    with:
      include-dir: include
      c-standards: '11;17;23'
      cxx-standards: '17;20;23'
      github-repo-version: v1

  abi-interface-rules:
    uses: liara-engine/.github/.github/workflows/reusable-abi-interface-rules.yml@v2
    with:
      include-dir: include
      std: 'c++20'
      prefix: 'liara'
      github-repo-version: v1

  abi-layout-freeze:
    uses: liara-engine/.github/.github/workflows/reusable-abi-layout-freeze.yml@v2
    with:
      include-dir: include
      golden-header: 'tests/abi/abi_layout.generated.h'
      github-repo-version: v1

  abi-snapshot:
    uses: liara-engine/.github/.github/workflows/reusable-abi-snapshot.yml@v2
    with:
      include-dir: include
      std: 'c++20'
      github-repo-version: v1

  report:
    needs: [ build-and-test, lint, abi-header-portability, abi-interface-rules, abi-layout-freeze, abi-snapshot ]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    uses: liara-engine/.github/.github/workflows/reusable-ci-report.yml@v2
    with:
      title: 'CI report'
      header: 'ci-report'
      github-repo-version: v1

name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  abi-header-portability:
    uses: liara-engine/.github/.github/workflows/reusable-abi-header-portability.yml@v0
    with:
      include-dir: include
      c-standards: '11;17;23'
      cxx-standards: '17;20;23'
      github-repo-version: v0

  abi-interface-rules:
    uses: liara-engine/.github/.github/workflows/reusable-abi-interface-rules.yml@v0
    with:
      include-dir: include
      std: 'c++20'
      prefix: 'liara'
      github-repo-version: v0

  abi-layout-freeze:
    uses: liara-engine/.github/.github/workflows/reusable-abi-layout-freeze.yml@v0
    with:
      include-dir: include
      golden-header: 'tests/abi/abi_layout.generated.h'
      github-repo-version: v0

  abi-snapshot:
    uses: liara-engine/.github/.github/workflows/reusable-abi-snapshot.yml@v0
    with:
      include-dir: include
      std: 'c++20'
      github-repo-version: v0

  abi-report:
    needs: [abi-header-portability, abi-interface-rules, abi-layout-freeze, abi-snapshot]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    uses: liara-engine/.github/.github/workflows/reusable-abi-report.yml@v0
    with:
      github-repo-version: v0

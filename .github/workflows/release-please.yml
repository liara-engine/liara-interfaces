name: release-please
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.ORG_RELEASE_PLEASE_TOKEN }}

  publish-abi-oracle:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - run: cmake --build build --target liara_abi_oracle --config Release

      - uses: actions/upload-artifact@v7
        with:
          name: liara-abi-oracle-linux-x86_64
          path: build/liara_abi_oracle
          if-no-files-found: error

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} build/liara_abi_oracle#liara_abi_oracle-linux-x86_64 --clobber

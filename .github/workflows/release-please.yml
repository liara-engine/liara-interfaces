name: release-please
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.ORG_RELEASE_PLEASE_TOKEN }}

  publish-abi-oracle:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: '${{ github.repository_owner }}/.github'
          ref: 'main'
          path: .github-shared-core

      - uses: ./.github-shared-core/.github/actions/setup-workspace
        with:
          module: liara-interfaces
          configure-preset: linux-release-clang
          toolchain: clang

      - shell: bash
        working-directory: _root/workspace
        run: cmake --build --target liara_abi_oracle --preset linux-release-clang

      - uses: actions/upload-artifact@v7
        with:
          name: liara-abi-oracle-linux-x86_64
          path: _root/workspace/build/linux-release-clang/bin/liara_abi_oracle
          if-no-files-found: error

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: _root/workspace/build/linux-release-clang/bin/liara_abi_oracle
